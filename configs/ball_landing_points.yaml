# Ball landing points relative to the launch tool.
# Source: ball_distances.txt (local frames) + ball_throwing.txt (floor/base/tool frames).
#
# Frame (origin at the tool, z up):
#   z: vertical, up. The floor is at z = -tool_height.
#   x: horizontal, along the line fitted (least squares) through all 100 landing points together.
#   y: horizontal, to the left. y = 0 on the fitted line, so y is the lateral distance from that line.
#   The tool launches along its own x axis, which is pitched up by pitch_deg (yaw ~0.16 deg in the floor frame).
# Assumption: the Franka base axes are parallel to the floor axes.
# Units: mm, degrees, grams (except launch_speed in m/s and energy in J).
# launch_speed / energy: drag-free projectile from the tool origin at pitch_deg, landing with the
#   ball centre one radius above the floor; computed per throw from the horizontal range, then averaged.
#   energy = 1/2 m v^2 (translational only; spin and air drag are neglected).

pitch_deg: 32.80          # angle of the tool x axis above the horizontal
tool_height: 1543.3       # tool above the floor

# Line fit in the floor frame: y = 0.03324 x + -81.3 (mm).
# To go from this frame back to the floor frame:
line_yaw_deg: 1.904      # x axis rotated by this angle about z relative to the floor x axis
line_offset_y: -30.9      # lateral offset of the fitted line from the tool along floor +y (negative = to the right)

