# Objects of the real ball throwing experiment, choice 7 of the testing node.
#
# launch/handtool_throw_exp.launch loads this file AFTER configs/throw_objects.yaml: the
# default pose and the motion times stay there, only the entries below are replaced.
# Every pose is in the robot base frame (panda_link0).
#
# No object has a 'target': for every object, right before it is grabbed, the testing node
# waits for fresh qualisys poses of the robot base ('mpc_franka') and of the box
# ('box_target'), and aims at the box point below.

testing:

  # [m] point the ball centre aims at, in the frame of the 'box_target' rigid body: the box
  # can be moved and turned, the point follows it. [0, 0, 0] is the origin of the body.
  box_target_offset: [0.0, 0.0, 0.0]

  # [m] every ball is thrown from here: above ball6cm, the first one (thrown from above
  # ball7cm and ball8cm the tool hits the robot), 3 cm back for the air hose.
  # z = 0.70: lower, the tube end behind the flange swings under the top of the rack on the
  # steep throws (0 cm left at 80 deg from z = 0.50), and the elbow (q4) and the wrist (q6)
  # are at their limits. From here, kinematic check of the whole sequence up to 80 deg:
  # >= 6 cm from the rack, >= 0.34 rad from the joint limits.
  # Update it when the grasp pose of ball6cm changes.
  throw_position: [0.3863, -0.1710, 0.70]

  # mass and energy of configs/ball_landing_points.yaml. An object without grasp_pose is
  # skipped with an error: fill each one with the measured pose of the tube tip on the
  # ball (grasped from above, tube pointing down: orientation [0.5, 0.5, -0.5, 0.5]).
  objects:
    - name: ball6cm
      mass: 0.085
      energy: 1.261
      grasp_pose:
        position: [0.4163359533877259, -0.17096781488766022, 0.3899315699771453]     # [m]
        orientation: [-0.502094732956324, -0.5030113447544889, 0.5067405228672747, -0.4879492890352433]


    - name: ball7cm
      mass: 0.144
      energy: 1.413
      grasp_pose:
        position: [0.41627109451975786, -0.008003849593625604, 0.3971754284276952]     # [m]
        orientation: [-0.509064458549812, -0.49941133034753327, 0.5161822903357625, -0.47433905943493665]


    - name: ball8cm
      mass: 0.188
      energy: 1.308
      grasp_pose:
        position: [0.4095894877241757, 0.16214763581226188, 0.40574817952487874]     # [m]
        orientation: [0.5224979657387766, 0.49152529971928277, -0.49747214883459023, 0.48777065990955715]

