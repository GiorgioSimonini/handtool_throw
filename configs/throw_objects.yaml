# Objects sequence executed by the choice 7 of the testing node.
#
# Every pose is expressed in the ROBOT BASE frame (panda_link0), the same frame of
# /backstepping_controller/franka_pose and of the pose returned by the throwing service.
# An orientation can be written either as
#   rpy_deg: [r, p, y]                  # [deg] extrinsic xyz angles, R = Rz*Ry*Rx
#   orientation: [x, y, z, w]           # quaternion
#
# The parameters live in the 'testing' namespace, next to the ones of handtool_params.yaml.

testing:

  # --- pose the sequence starts from and comes back to after every throw --- #
  # MUST be filled with a real robot pose: while this block stays commented out
  # the choice 7 refuses to start.
  default_pose:
    position: [0.3, -0.4, 0.35]         # [m]
    orientation: [1.0, 0.0, 0.0, 0.0]          # [quat]


  # --- the object is reached from the approach pose, and left the same way --- #
  # The offset is expressed in the TIP frame of the grasping pose, not in the base frame:
  # approach_pose = grasp_pose * translation(approach_offset). -x moves the tool away
  # from the object, so the approach and the retreat run along the tool axis.
  approach_offset: [-0.1, 0.0, 0.0]     # [m] tip frame, keep it clear of the object

  # --- durations of the minimum jerk motions --- #
  move_time: 3.0                        # [s] default <-> approach <-> throwing pose
  approach_time: 1.5                    # [s] approach pose <-> grasping pose

  # --- the trajectory ends before the controller has actually settled on the last
  #     commanded pose: wait here, on the throwing pose, before blowing --- #
  pre_throw_time: 1.0                   # [s] 0.0 throws as soon as the trajectory ends


  # --- objects, thrown one after the other, a key press separates them --- #
  # mass and grasp_pose are required, an entry missing one of them is skipped.
  # target is optional: without it the box measured by qualisys is used for that object.
  objects:
    - name: small_cube
      mass: 0.1                         # [kg]
      grasp_pose:                       # object grasp pose
        position: [0.55, 0.0, 0.2]       # [m]
        # rpy_deg: [90.0, 90.0, 0.0]        # [deg]
        orientation: [0.5, 0.5, -0.5, 0.5]
      target: [3.0, 0.0, -0.94]           # [m] fixed target, qualisys is not needed

    - name: big_cube
      mass: 0.5                         # [kg]
      grasp_pose:                       # object grasp pose
        position: [0.55, 0.0, 0.2]       # [m]
        # rpy_deg: [90.0, 90.0, 0.0]        # [deg]
        orientation: [0.5, 0.5, -0.5, 0.5]
      # no target here: this object is thrown at the box measured by qualisys

