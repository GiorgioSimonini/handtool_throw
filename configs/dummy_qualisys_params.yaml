dummy_qualisys:
  rate: 100.0                       # [Hz] qualisys publishes at 100 Hz
  frame_id: mocap                   # matches fixed_frame_id of qualisys.launch
  franka_base_topic: /qualisys/mpc_franka/pose
  target_topic: /qualisys/box_target/pose

  franka_base:                      # robot base pose in the mocap frame
    position: [0.0, 0.0, 0.0]       # [m]
    rpy_deg: [0.0, 0.0, 0.0]        # [deg]

  target:                           # target box position in the mocap frame
    position: [3.0, 0.0, 0.0]       # [m], xy distance from the base must exceed dist_base
