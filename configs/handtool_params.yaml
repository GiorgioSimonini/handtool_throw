testing:
  pre_suct_time: 2.0
  suct_time: 0.5
  valve_us: 50000
  duty_regulator: 255

  # --- reference orientation of the tool at the throw, robot base frame --- #
  # It must hold the tube HORIZONTAL and pointing along the base +x: the testing node
  # tilts it up by the launch angle theta returned by the service, then turns it to the
  # azimuth measured from optimization/throw_position to the target, as
  #   R_throw = Rz(azimuth) * Ry(-theta) * throw_orientation
  # So this parameter only decides the roll of the tool around the tube, that is which
  # side the flange stays on while aiming: it does NOT change where the object lands.
  # Written as rpy_deg [r, p, y] or as orientation [x, y, z, w], like every other pose.
  throw_orientation:
    orientation: [1.0, 0.0, 0.0, 0.0]   # [x,y,z,w] tube along +x, flange above the tube
    # rpy_deg: [90.0, 0.0, 0.0]         # flange on the left, what the service hard-coded

Params:
  duty_cycle: 100

optimization:
  throw_position: [0.3, -0.4, 0.35]   # [m] handtool tip, the fixed point the object leaves from
  dist_min: 0.05                # [m] a target closer than this to throw_position (horizontally) is rejected: no throwing direction
  valve_0: 0.051                # [s] valve opening time with no throw (energy model offset)
  g: 9.81                       # [m/s^2]
  IG_valve: 0.052               # [s] initial guess, clipped inside bound_valve
  IG_theta: 0.0                 # [rad] initial guess, clipped inside bound_theta_deg
  bound_valve: [0.051, 0.5]     # [s]
  bound_theta_deg: [0.0, 90.0]  # [deg], converted to rad by the node
  valve_ref: 0.06               # [s] valve time we trust, the cost keeps the solution near it. Kept well clear of the pole in fun_energy: the landing point moves 3.3 cm per 100 us of valve jitter at 0.052, 0.2 cm at 0.06.
  theta_ref_deg: 45.0           # [deg] preferred launch angle
  w_valve: 1.0                  # weight on the normalised valve deviation (expensive)
  w_theta: 0.01                 # weight on the normalised theta deviation (cheap, used first)
  valve_scale: 0.001            # [s] normalisation of the valve deviation. NOT the bound range: the energy model has a pole just below valve_0, so its whole useful range is ~1 ms wide. Larger values make the valve look free and it takes over the aiming from theta.
  theta_scale_deg: 45.0         # [deg] normalisation of the theta deviation
  dist_tol: 0.001               # [m] a solution missing by more than this is reported as failed
