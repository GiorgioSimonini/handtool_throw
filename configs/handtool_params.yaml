testing:
  pre_suct_time: 2.0
  suct_time: 0.5
  valve_us: 50000
  duty_regulator: 255

Params:
  duty_cycle: 100

optimization:
  dist_base: 0.5        # [m] tool distance from the robot base
  h_base: 0.4           # [m] tool height over the robot base
  valve_0: 0.051        # [s] valve opening time with no throw (energy model offset)
  g: 9.81               # [m/s^2]
  IG_valve: 0.052       # [s] initial guess, clipped inside bound_valve
  IG_theta: 0.0         # [rad] initial guess, clipped inside bound_theta_deg
  bound_valve: [0.051, 0.5]     # [s]
  bound_theta_deg: [-90.0, 90.0]  # [deg], converted to rad by the node
